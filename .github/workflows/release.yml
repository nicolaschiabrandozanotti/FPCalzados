name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/*.csproj'

      - name: Validate tag and project version
        shell: powershell
        run: |
          $tagVersion = '${{ github.ref_name }}'.TrimStart('v')
          [xml]$project = Get-Content src/FPCalzados.App/FPCalzados.App.csproj
          $projectVersion = $project.Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          if ($tagVersion -ne $projectVersion) {
            throw "Tag v$tagVersion does not match project version $projectVersion"
          }

      - run: dotnet tool restore
      - name: Verify
        shell: powershell
        run: ./scripts/verify.ps1

      - name: Publish
        run: dotnet publish src/FPCalzados.App/FPCalzados.App.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o artifacts/FPCalzados-win-x64

      - name: Package and checksum
        shell: powershell
        run: |
          Compress-Archive artifacts/FPCalzados-win-x64/* artifacts/FPCalzados-${{ github.ref_name }}-win-x64.zip
          $hash = (Get-FileHash artifacts/FPCalzados-${{ github.ref_name }}-win-x64.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  FPCalzados-${{ github.ref_name }}-win-x64.zip" | Set-Content artifacts/SHA256SUMS.txt

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/FPCalzados-${{ github.ref_name }}-win-x64.zip
            artifacts/SHA256SUMS.txt
